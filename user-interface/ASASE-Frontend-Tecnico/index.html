const translationPairs = Object.entries(englishTranslations).sort((a,b)=>b[0].length-a[0].length);
let language = (()=>{try{return localStorage.getItem('asase.language')==='en'?'en':'es'}catch{return 'es'}})();
function translateString(input){
  if(language!=='en'||typeof input!=='string') return input;
  // Traducción de frases enteras y, para textos dinámicos, de sus segmentos.
  if(Object.hasOwn(englishTranslations,input)) return englishTranslations[input];
  let result=input;
  for(const [es,en] of translationPairs) if(result.includes(es)) result=result.split(es).join(en);
  return result;
}
function languageSwitcher(){return `<div class="language-switch" role="group" aria-label="Idioma / Language"><button type="button" data-language="es" lang="es" aria-pressed="${language==='es'}" class="${language==='es'?'active':''}">ES</button><button type="button" data-language="en" lang="en" aria-pressed="${language==='en'}" class="${language==='en'?'active':''}">EN</button></div>`}
function translateUI(root){
  document.documentElement.lang=language;
  document.title=language==='en'?'asase. — Intelligence to protect agricultural productivity':'asase. — Inteligencia para proteger la productividad agrícola';
  if(language!=='en')return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let node;
  while(node=walker.nextNode()){
    if(node.parentElement?.closest('.language-switch')) continue;
    node.nodeValue=translateString(node.nodeValue);
  }
  for(const el of root.querySelectorAll('[aria-label],[title],[placeholder]')){
    if(el.closest('.language-switch'))continue;
    for(const attr of ['aria-label','title','placeholder']){
      const value=el.getAttribute(attr);
      if(value!==null)el.setAttribute(attr,translateString(value));
    }
  }
}

/* VIEWS */
function options(items,value){return items.map(([v,n])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(n)}</option>`).join('')}
function filters(){return `<div class="filter-strip"><label class="select-wrap crop-control"><span class="select-icon">${I('sprout')}</span><span class="select-content"><span class="filter-label">CULTIVO A ESTUDIAR</span><select id="crop">${options([['registered','Cultivos registrados por parcela'],...cropNames.map(c=>[c,c])],state.crop)}</select></span>${I('chevron').replace('<svg','<svg width="18" height="18"')}</label><label class="select-wrap"><span class="select-icon">${I('calendar')}</span><span class="select-content"><span class="filter-label">Fecha de consulta · hasta ${niceDate(endDate)}</span><input class="date-input" id="date" type="date" min="${today}" max="${endDate}" value="${state.date}"></span></label><button class="primary-button" data-register>${I('sprout')} Registrar cultivo</button></div>`}
function detail(){const p=selected();if(!p)return '';const rows=evaluations(p);let r=rows.find(x=>x.record?.id===state.parcel)||result(p);const s=r.iac,k=level(s);return `<article class="card detail"><div class="detail-top"><span class="detail-kicker">Indicador de Aptitud de Cultivo</span><button class="icon-btn" data-close-detail aria-label="Cerrar análisis">${I('close')}</button></div><h2 class="parcel-name">${p.name}</h2><div class="context-line">${esc(r.crop||'Sin cultivo registrado')} ${r.parcel?'· '+esc(r.parcel):'· Referencia regional'}</div>${state.crop==='registered'&&rows.length?`<label class="field parcel-select">Parcela analizada<select id="detail-parcel">${options(rows.map(x=>[x.record.id,x.parcel+' · '+x.crop]),r.record?.id)}</select></label>`:''}<div class="score-block"><div><div class="score-numeral">${s??'—'}<span>/100</span></div><div class="score-caption">Aptitud del cultivo · ${s===null?'Sin evaluación':'Ejemplo simulado'}</div></div><div class="ring" style="--pct:${s??0};--ringColor:${colors[k]}"><div class="ring-inner"><strong>${names[k]}</strong><small>Prioridad</small></div></div></div><div class="insight">${I('info')}<span>${esc(r.motivo)}</span></div><div class="section-label">Lectura del indicador</div><div class="context-line" style="line-height:1.8;padding-bottom:20px">El IAC expresa aptitud relativa para un cultivo y un suelo. No equivale a toneladas por hectárea ni garantiza la productividad de la cosecha.</div><div style="padding:0 20px 22px;display:flex;gap:8px;flex-wrap:wrap"><button class="primary-button" data-register>Registrar cultivo aquí</button><button class="muted-button" data-view="sources">Ver fuentes</button></div></article>`}
function mapCard(){return `<section class="card"><div class="card-header"><div><h2 class="card-headline">Mapa del norte de Ghana</h2><p class="card-sub">Selecciona una región para abrir su análisis.</p></div><span class="source-state">${state.crop==='registered'?'Cultivos de tus parcelas':esc(state.crop)}</span></div><div class="map-outer">${mapSvg()}<div class="map-top-left">${I('layers')} Norte de Ghana · 5 regiones</div><div class="map-bottom-left">Límites regionales reales · IAC de demostración</div><div class="map-zoom"><button data-zoom="in" aria-label="Ampliar mapa">+</button><button data-zoom="out" aria-label="Alejar mapa">−</button><button data-zoom="reset" aria-label="Restablecer mapa">⌖</button></div><div class="map-compass"><span>N</span></div></div><div class="legend"><b>Prioridad</b>${Object.entries(names).map(([k,n])=>`<span><i class="legend-dot" style="background:${colors[k]}"></i>${n}</span>`).join('')}</div></section>`}
function priorityCard(){const ranked=data.flatMap(p=>evaluations(p).map(r=>({...r,region:p}))).filter(r=>r.iac!==null).sort((a,b)=>a.iac-b.iac);return `<section class="card bottom-card"><h2 class="card-headline">Dónde actuar primero</h2><p class="card-sub">${state.crop==='registered'?'Tus parcelas, según la aptitud de su cultivo registrado.':'Comparación regional para '+esc(state.crop)+'.'} Menor IAC, mayor prioridad.</p><div class="priority-list">${ranked.length?ranked.map((r,i)=>`<button class="priority-item" data-parcel="${r.region.id}" data-record="${esc(r.record?.id||'')}"><span class="priority-icon">${i+1}</span><span class="priority-text"><strong>${esc(r.parcel||r.region.name)}</strong><small>${r.parcel?r.region.name+' · ':''}${esc(r.crop)}</small></span><span class="priority-badge ${level(r.iac)}">${names[level(r.iac)]}</span><span class="mini-score">${r.iac}</span>${I('arrow')}</button>`).join(''):`<div class="empty">Aún no hay cultivos registrados para esta fecha. Añade una parcela y su cultivo para empezar a priorizar.</div><button class="muted-button" data-register>Registrar mi primer cultivo</button>`}</div></section>`}
function historyCard(){return `<section class="card bottom-card"><div class="header-action"><h2 class="card-headline">Historial de cultivos</h2><span class="source-state">${records.length} registros</span></div><p class="card-sub">Siembra registrada y cambios de cultivo por parcela.</p><div class="history">${records.length?[...records].reverse().map(r=>`<div class="history-row"><strong>${esc(r.parcel)}</strong> · ${esc(r.crop)}<br><small>${data.find(p=>p.id===r.region).name} · ${niceDate(r.date)}${r.date>today?' · Planificado':''}</small></div>`).join(''):'<div class="empty">Tu historial aparecerá aquí cuando registres el primer cultivo.</div>'}</div></section>`}
function dashboard(){return `<div class="layout ${state.selected?'open':''}" id="map-layout"><div>${mapCard()}</div><div class="detail-shell" id="detail-shell" ${state.selected?'':'inert'}>${detail()}</div></div><div class="bottom-grid">${priorityCard()}${historyCard()}</div>`}
function regionView(){return `<section class="card view-panel"><h2>Análisis por región</h2><p>En el modo de cultivos registrados, cada región toma el menor IAC de sus parcelas como referencia de prioridad. La geometría del mapa es regional; no representa los límites de cada parcela.</p><div class="table-scroll"><table class="region-table"><thead><tr><th>Región</th><th>Cultivo de referencia</th><th>Parcelas</th><th>IAC</th><th>Análisis</th></tr></thead><tbody>${[...data].sort((a,b)=>(score(a)??101)-(score(b)??101)).map(p=>`<tr><td>${p.name}</td><td>${esc(result(p).crop||'Sin registros')}</td><td>${regionRecords(p).length}</td><td>${score(p)??'—'}</td><td><button class="muted-button" data-parcel="${p.id}">Ver región</button></td></tr>`).join('')}</tbody></table></div></section>`}
function cropView(){const p=selected();return `<label class="field page-selector">Región para comparar<select id="compare-region">${options([['','Selecciona una región'],...data.map(p=>[p.id,p.name])],state.selected||'')}</select></label>${p?`<section class="card view-panel"><h2>Alternativas en ${p.name}</h2><p>Mismo suelo de referencia, doce cultivos. Comparación ilustrativa; no es una recomendación de rotación validada.</p><div class="compare-row">${cropNames.map(c=>({c,...evaluateIAC(c,p)})).sort((a,b)=>b.iac-a.iac).map(r=>`<div class="compare-track"><span class="compare-name">${r.c}</span><div class="bar-track"><div class="bar-fill" style="width:${r.iac}%"></div></div><span class="compare-number">${r.iac}</span></div>`).join('')}</div><p class="compare-note">Los motivos e índices proceden del adaptador de demostración. Cada parcela necesita sus propios datos de suelo para una evaluación real.</p><button class="primary-button" data-register>Registrar cultivo en esta región</button></section>`:'<section class="card view-panel"><p>Selecciona una región para comparar la aptitud de los doce cultivos.</p></section>'}`}
function sources(){return `<div class="source-grid"><article class="card view-panel"><span class="source-state">Incorporada</span><h2 style="margin-top:18px">Cartografía</h2><p>Límites de Upper West, Upper East, North East, Northern y Savannah procedentes de amCharts 4 Geodata, Ghana Low. Polígonos proyectados y simplificados para este mapa.</p><a href="https://github.com/amcharts/amcharts4-geodata" target="_blank" rel="noopener">amCharts Geodata ↗</a><p>Licencia CC BY 4.0. El mapa no delimita parcelas y no proporciona información catastral.</p></article><article class="card view-panel"><span class="source-state">Datos introducidos por el técnico</span><h2 style="margin-top:18px">Parcelas e historial</h2><p>Nombre de parcela, región, cultivo y fecha: formulario de registro. Se guardan en este navegador. Para una misma parcela, se utiliza el último registro cuya fecha no supere la consulta.</p><p>En esta versión, el nombre identifica la parcela dentro de su región. Las parcelas aún no tienen geometría ni análisis de suelo individual.</p></article><article class="card view-panel"><span class="source-state">Simulación · sin backend</span><h2 style="margin-top:18px">IAC, motivos y prioridad</h2><p>Índices y motivos generados por un adaptador de demostración en el frontend. No proceden de NASA ni de mediciones de campo. La prioridad ordena el IAC de menor a mayor; alta &lt;58, media 58–70, baja ≥71. Umbrales de interfaz sin validación agronómica.</p><p>El calendario limita la consulta a 90 días y selecciona registros vigentes. No modifica ni predice el estado futuro del suelo. La futura función recibirá cultivo y suelo y devolverá IAC y motivo.</p></article><article class="card view-panel"><span class="source-state">Fuentes previstas · no conectadas</span><h2 style="margin-top:18px">Clima y suelo</h2><p>NASA POWER y SoilGrids son fuentes candidatas del proyecto. Esta versión no consume sus datos, por lo que no se les atribuyen los resultados mostrados.</p><p>Antes de integrar datos se documentarán variables, unidades, resolución, fecha de actualización y limitaciones.</p></article></div>`}
function login(){return `<main class="login"><div class="login-wrap"><section class="login-art"><div class="brand-word">asase.</div><div><div class="eyebrow" style="color:#bdd6c3">NORTE DE GHANA</div><h1>Conocer la tierra.<br>Cuidar lo que viene.</h1><p>Un espacio para registrar cultivos, analizar el suelo y decidir dónde actuar primero.</p></div><span style="font-size:11px;color:#bdd6c3">Agricultural intelligence</span></section><section class="login-form"><div class="login-locale">${languageSwitcher()}</div><div class="eyebrow">Espacio del técnico</div><h2>Bienvenido a asase.</h2><p>Accede a tus parcelas y al análisis de cultivos.</p><form id="login-form"><label class="field">Correo electrónico<input name="email" type="email" autocomplete="username" required placeholder="tecnico@cooperativa.org"></label><label class="field">Contraseña<input name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Mínimo 6 caracteres"></label><button class="primary-button" type="submit">Iniciar sesión ${I('arrow')}</button></form><button class="muted-button" data-demo>Explorar como técnico de demostración</button><p style="font-size:11px">Acceso de demostración: no verifica credenciales. Utiliza datos ficticios. La contraseña no se guarda ni se envía.</p></section></div></main>`}
function registerDialog(){return `<dialog class="dialog" id="register-dialog" aria-labelledby="register-title"><form id="register-form"><div class="header-action"><h2 id="register-title">Registrar un cultivo</h2><button class="icon-btn" type="button" data-cancel aria-label="Cerrar registro">${I('close')}</button></div><p>Asocia un cultivo a tu parcela. Para cambiarlo, utiliza el mismo nombre de parcela y región.</p><label class="field">Nombre o código de parcela<input name="parcel" required maxlength="60" placeholder="Ej. Parcela Tamale 01"></label><label class="field">Región<select name="region" required>${options([['','Selecciona una región'],...data.map(p=>[p.id,p.name])],state.selected||'')}</select></label><label class="field">Cultivo<select name="crop" required>${options([['','Selecciona un cultivo'],...cropNames.map(c=>[c,c])],state.crop==='registered'?'':state.crop)}</select></label><label class="field">Fecha de siembra o cambio<input name="date" type="date" required max="${endDate}" value="${state.date}"></label><p class="form-error" id="register-error" role="alert"></p><div class="dialog-actions"><button type="button" class="muted-button" data-cancel>Cancelar</button><button class="primary-button" type="submit">Guardar cultivo</button></div></form></dialog>`}
function layout(){const title=navItems.find(x=>x[0]===state.view)[2];return `<div class="app"><div class="sidebar-overlay ${state.menu?'visible':''}" data-menuclose></div><aside class="sidebar ${state.menu?'open':''}"><div class="brand"><div class="brand-symbol">${I('fields')}</div><div><div class="brand-name">asase.</div><div class="brand-sub">Agricultural intelligence</div></div></div><div class="sidebar-label">PLATAFORMA</div><nav class="nav" aria-label="Principal">${navItems.map(([id,ic,n])=>`<button class="nav-btn ${state.view===id?'active':''}" data-view="${id}" ${state.view===id?'aria-current="page"':''}>${I(ic)}<span>${n}</span></button>`).join('')}</nav><div class="nav-separator"></div><div style="padding:12px;color:#7a9081;font-size:12px;line-height:1.8">Norte de Ghana<br>Espacio del técnico</div><div class="sidebar-spacer"></div><div class="sidebar-foot"><div class="sidebar-foot-top"><span class="status-dot"></span> Prototipo frontend</div><p>IAC de demostración.<br>Registros guardados en este navegador.</p></div></aside><main class="page"><header class="topbar"><div class="crumbs"><button class="icon-btn mobile-menu" data-menutoggle aria-label="Abrir menú">${I('menu')}</button><span>asase.</span><span>/</span><b>${title}</b></div><div class="top-actions">${languageSwitcher()}<span class="demo">● Demostración</span><span class="profile">Técnico</span><button class="icon-btn" data-logout aria-label="Cerrar sesión" title="Cerrar sesión">${I('user')}</button></div></header><div class="main"><div class="eyebrow">Inteligencia agrícola · Norte de Ghana</div><div class="heading"><div><h1>${state.view==='overview'?'Anticipar. Priorizar. Proteger.':title+'.'}</h1><p>${state.view==='overview'?'Cada parcela, su cultivo. Cada decisión, un motivo.':'Una lectura del suelo orientada a tus cultivos.'}</p></div></div>${state.view==='sources'?'':filters()}${state.view==='overview'?dashboard():state.view==='regions'?regionView():state.view==='crops'?cropView():sources()}${storageWarning?'<p class="form-error" role="alert">El navegador no permite guardar datos. Los registros se conservarán solo durante esta sesión.</p>':''}<footer class="foot"><span>${I('info')} IAC simulado · No representa rendimiento real ni predicción futura.</span><button class="muted-button" data-view="sources">Fuentes y metodología</button></footer></div></main></div>${registerDialog()}`}
function render(){const root=document.querySelector('#app');root.innerHTML=state.user?layout():login();translateUI(root);attach()}
function toast(message){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=translateString(message);document.body.append(el);setTimeout(()=>el.remove(),3500)}
function openRegion(id,record){const wasOpen=!!state.selected,wasOverview=state.view==='overview';state.selected=id;state.parcel=record||null;state.view='overview';state.menu=false;if(wasOverview&&!wasOpen){document.querySelector('#detail-shell').innerHTML=detail();translateUI(document.querySelector('#detail-shell'));document.querySelector('#detail-shell').removeAttribute('inert');document.querySelector('#map-layout').classList.add('open');document.querySelectorAll('.geo-region').forEach(el=>el.classList.toggle('selected',+el.parentElement.dataset.parcel===id));bindDetail();}else render();if(window.innerWidth<=800)document.querySelector('#detail-shell').scrollIntoView({behavior:'smooth',block:'start'})}
function bindDetail(){document.querySelector('[data-close-detail]')?.addEventListener('click',()=>{state.selected=null;state.parcel=null;document.querySelector('#map-layout').classList.remove('open');document.querySelector('#detail-shell').setAttribute('inert','');document.querySelectorAll('.geo-region').forEach(el=>el.classList.remove('selected'));document.querySelector('.geo-region-item')?.focus()});document.querySelector('#detail-parcel')?.addEventListener('change',e=>{state.parcel=e.target.value;render()});document.querySelectorAll('#detail-shell [data-register]').forEach(el=>el.onclick=openRegister);document.querySelectorAll('#detail-shell [data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view;render()})}
function openRegister(){const dialog=document.querySelector('#register-dialog');dialog.querySelector('[name=region]').value=state.selected||'';dialog.showModal()}
function attach(){document.querySelectorAll('[data-language]').forEach(el=>el.addEventListener('click',()=>{const next=el.dataset.language;if(next===language)return;language=next;try{localStorage.setItem('asase.language',language)}catch{storageWarning=true}render()}));document.querySelector('#login-form')?.addEventListener('submit',e=>{e.preventDefault();state.user='tech';e.target.reset();render()});document.querySelector('[data-demo]')?.addEventListener('click',()=>{state.user='demo';render()});document.querySelector('[data-logout]')?.addEventListener('click',()=>{state.user=null;state.selected=null;state.view='overview';render()});document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view;state.menu=false;render()});document.querySelectorAll('[data-parcel]').forEach(el=>{el.addEventListener('click',()=>openRegion(+el.dataset.parcel,el.dataset.record));if(el.tagName.toLowerCase()==='g')el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openRegion(+el.dataset.parcel)}}});document.querySelector('#crop')?.addEventListener('change',e=>{state.crop=e.target.value;state.parcel=null;render()});document.querySelector('#date')?.addEventListener('change',e=>{if(!e.target.value||e.target.value<today||e.target.value>endDate){e.target.value=state.date;toast('Selecciona una fecha dentro de los próximos 90 días.');return}state.date=e.target.value;render()});document.querySelector('#compare-region')?.addEventListener('change',e=>{state.selected=+e.target.value||null;render()});document.querySelectorAll('[data-register]').forEach(el=>el.onclick=openRegister);document.querySelectorAll('[data-cancel]').forEach(el=>el.onclick=()=>document.querySelector('#register-dialog').close());document.querySelector('[data-menutoggle]')?.addEventListener('click',()=>{state.menu=!state.menu;render()});document.querySelector('[data-menuclose]')?.addEventListener('click',()=>{state.menu=false;render()});document.querySelectorAll('[data-zoom]').forEach(el=>el.onclick=()=>{state.zoom=el.dataset.zoom==='reset'?1:Math.max(1,Math.min(2.4,state.zoom+(el.dataset.zoom==='in'?.2:-.2)));render()});bindDetail();document.querySelector('#register-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),parcel=f.get('parcel').trim(),region=+f.get('region'),crop=f.get('crop'),date=f.get('date');if(!parcel||!data.some(p=>p.id===region)||!cropNames.includes(crop)||!date||date>endDate){document.querySelector('#register-error').textContent=translateString('Revisa el nombre, la región, el cultivo y la fecha.');return}if(records.some(r=>r.parcel.toLocaleLowerCase()===parcel.toLocaleLowerCase()&&r.region===region&&r.date===date)){document.querySelector('#register-error').textContent=translateString('Ya existe un registro para esa parcela en esa fecha. Elige otra fecha para registrar un cambio.');return}const record={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),parcel,region,crop,date,at:new Date().toISOString()};records.push(record);try{localStorage.setItem('asase.records.v2',JSON.stringify(records))}catch{storageWarning=true}state.crop='registered';state.selected=region;state.parcel=record.id;state.view='overview';render();toast('Cultivo registrado. Historial y prioridades actualizados.')})}
render();
})();
</script>
</body>
</html>
